[project]
name = "quant-etf"
version = "0.1.0"
description = "A-share ETF quantitative trading system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.18.40",
    "numpy>=1.26",
    "pandas>=2.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
